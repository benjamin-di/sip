name: Fleet release
on:
  push:
    tags: ['v*-fleet.*']
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - run: bash .github/ci/require-ci.sh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          WORKFLOW: ci.yml
          WAIT: 1200
  image:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build immutable candidate
        run: |
          set -euo pipefail
          image="ghcr.io/$GITHUB_REPOSITORY:sha-${GITHUB_SHA:0:12}"
          docker buildx build --provenance=false --push --file build/sip/Dockerfile \
            --build-arg GOVERSION=1.26.10 --build-arg VERSION="$GITHUB_REF_NAME" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=${GITHUB_REF_NAME#v}" \
            --metadata-file /tmp/image.json --tag "$image" .
          digest="$(jq -er '."containerimage.digest"' /tmp/image.json)"
          echo "TESTED_DIGEST=$digest" >> "$GITHUB_ENV"
      - name: Check exact image without a network
        run: |
          set -euo pipefail
          image="ghcr.io/$GITHUB_REPOSITORY@$TESTED_DIGEST"
          docker run --rm --network none --read-only --entrypoint /bin/livekit-sip "$image" --version | grep -F "$GITHUB_REF_NAME"
          test "$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
      - name: Promote tested digest
        run: |
          set -euo pipefail
          release="ghcr.io/$GITHUB_REPOSITORY:${GITHUB_REF_NAME#v}"
          if current="$(docker buildx imagetools inspect "$release" --format '{{json .Manifest}}' 2>/tmp/manifest-error | jq -er .digest)"; then
            test "$current" = "$TESTED_DIGEST"
          else
            grep -Eqi 'manifest unknown|not found' /tmp/manifest-error
            docker buildx imagetools create --prefer-index=false --tag "$release" "ghcr.io/$GITHUB_REPOSITORY@$TESTED_DIGEST"
          fi
          test "$(docker buildx imagetools inspect "$release" --format '{{json .Manifest}}' | jq -er .digest)" = "$TESTED_DIGEST"
